<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Italia — Stratificazione Cronologica del Costruito</title>
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
  <script src="https://unpkg.com/pmtiles@3.2.0/dist/pmtiles.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0a14; font-family: 'Arial', sans-serif; }
    #map { width: 100vw; height: 100vh; }

    #title {
      position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
      z-index: 1000; background: rgba(8,8,20,0.93); color: #f1f5f9;
      padding: 10px 24px; border-radius: 12px; font-size: 16px;
      font-weight: bold; border: 1px solid #2d3748; white-space: nowrap;
      pointer-events: none; letter-spacing: 0.3px;
    }

    #legend {
      position: fixed; bottom: 40px; left: 12px; z-index: 1000;
      background: rgba(8,8,20,0.93); color: #e2e8f0;
      padding: 14px 16px; border-radius: 12px; font-size: 12px;
      border: 1px solid #2d3748; min-width: 175px;
    }
    #legend h4 {
      margin-bottom: 10px; font-size: 13px; font-weight: 700;
      border-bottom: 1px solid #2d3748; padding-bottom: 6px; color: #f1f5f9;
    }
    .legend-item { display: flex; align-items: center; margin: 5px 0; }
    .legend-color {
      width: 14px; height: 14px; border-radius: 3px;
      margin-right: 9px; flex-shrink: 0;
    }
    #legend small { display: block; margin-top: 10px; color: #718096; font-size: 10px; }

    #tooltip {
      position: fixed; pointer-events: none; z-index: 1000;
      background: rgba(8,8,20,0.95); color: #f1f5f9;
      padding: 10px 14px; border-radius: 10px; font-size: 12px;
      border: 1px solid #2d3748; display: none; min-width: 160px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    #tooltip .epoca-badge {
      font-size: 13px; font-weight: bold; margin-bottom: 6px;
      padding: 3px 8px; border-radius: 5px; display: inline-block;
    }
    #tooltip .info-row {
      margin: 3px 0; color: #a0aec0; font-size: 11px;
    }
    #tooltip .info-row span { color: #e2e8f0; font-weight: 500; }
  </style>
</head>
<body>
  <div id="title">🇮🇹 Italia — Stratificazione Cronologica del Costruito</div>

  <div id="legend">
    <h4>🏛️ Epoca di costruzione</h4>
    <div class="legend-item"><div class="legend-color" style="background:#1a0a2e"></div><span>Prima del 1919</span></div>
    <div class="legend-item"><div class="legend-color" style="background:#16317d"></div><span>1919–1945</span></div>
    <div class="legend-item"><div class="legend-color" style="background:#0d6e8a"></div><span>1946–1960</span></div>
    <div class="legend-item"><div class="legend-color" style="background:#0a7c5c"></div><span>1961–1970</span></div>
    <div class="legend-item"><div class="legend-color" style="background:#3a9e3a"></div><span>1971–1980</span></div>
    <div class="legend-item"><div class="legend-color" style="background:#c8b400"></div><span>1981–1990</span></div>
    <div class="legend-item"><div class="legend-color" style="background:#e07b00"></div><span>1991–2000</span></div>
    <div class="legend-item"><div class="legend-color" style="background:#cc1a1a"></div><span>Dopo il 2000</span></div>
    <div class="legend-item"><div class="legend-color" style="background:#4b5563"></div><span>Sconosciuto</span></div>
    <small>Fonte: ISTAT Censimento 2011<br>Geometrie: Microsoft Building Footprints</small>
  </div>

  <div id="tooltip"></div>
  <div id="map"></div>

  <script>
    const protocol = new pmtiles.Protocol();
    maplibregl.addProtocol("pmtiles", protocol.tile);

    const PMTILES_URL = "pmtiles://https://pub-8da6b94f2e6740e5b3f3128166a6ea2b.r2.dev/italia_edifici.pmtiles";

    const EPOCH_COLORS = {
      "Prima del 1919": "#1a0a2e",
      "1919–1945":      "#16317d",
      "1946–1960":      "#0d6e8a",
      "1961–1970":      "#0a7c5c",
      "1971–1980":      "#3a9e3a",
      "1981–1990":      "#c8b400",
      "1991–2000":      "#e07b00",
      "Dopo il 2000":   "#cc1a1a",
    };

    const map = new maplibregl.Map({
      container: 'map',
      style: {
        version: 8,
        sources: {
          'carto-dark': {
            type: 'raster',
            tiles: ['https://a.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}.png'],
            tileSize: 256,
            attribution: '&copy; CARTO &copy; OSM contributors'
          },
          'edifici': { type: 'vector', url: PMTILES_URL }
        },
        layers: [{ id: 'background', type: 'raster', source: 'carto-dark' }]
      },
      center: [12.5, 41.9],
      zoom: 6, maxZoom: 19, minZoom: 5
    });

    map.addControl(new maplibregl.NavigationControl(), 'top-right');
    map.addControl(new maplibregl.ScaleControl(), 'bottom-right');
    map.addControl(new maplibregl.FullscreenControl(), 'top-right');

    map.on('load', () => {
      map.addLayer({
        id: 'edifici-fill',
        type: 'fill',
        source: 'edifici',
        'source-layer': 'edifici',
        paint: {
          'fill-color': [
            'match', ['get', 'epoca'],
            'Prima del 1919', '#1a0a2e',
            '1919–1945',      '#16317d',
            '1946–1960',      '#0d6e8a',
            '1961–1970',      '#0a7c5c',
            '1971–1980',      '#3a9e3a',
            '1981–1990',      '#c8b400',
            '1991–2000',      '#e07b00',
            'Dopo il 2000',   '#cc1a1a',
            '#4b5563'
          ],
          'fill-opacity': ['interpolate', ['linear'], ['zoom'], 10, 0.75, 15, 0.9]
        }
      });

      map.addLayer({
        id: 'edifici-border',
        type: 'line',
        source: 'edifici',
        'source-layer': 'edifici',
        paint: {
          'line-color': '#000',
          'line-width': ['interpolate', ['linear'], ['zoom'], 12, 0.1, 16, 0.5],
          'line-opacity': ['interpolate', ['linear'], ['zoom'], 11, 0, 13, 0.4]
        }
      });

      const tooltip = document.getElementById('tooltip');

      map.on('mousemove', 'edifici-fill', (e) => {
        map.getCanvas().style.cursor = 'pointer';
        const props = e.features[0].properties;
        const epoca = props.epoca || 'Sconosciuto';
        const comune = props.comune || '';
        const quartiere = props.quartiere || '';
        const badgeColor = EPOCH_COLORS[epoca] || '#4b5563';

        let html = `<div class="epoca-badge" style="background:${badgeColor}20;color:${badgeColor};border:1px solid ${badgeColor}50">🏛️ ${epoca}</div>`;
        if (comune) html += `<div class="info-row">Comune: <span>${comune}</span></div>`;
        if (quartiere) html += `<div class="info-row">Quartiere: <span>${quartiere}</span></div>`;

        tooltip.innerHTML = html;
        tooltip.style.display = 'block';
        tooltip.style.left = (e.originalEvent.clientX + 14) + 'px';
        tooltip.style.top  = (e.originalEvent.clientY - 10) + 'px';
      });

      map.on('mouseleave', 'edifici-fill', () => {
        map.getCanvas().style.cursor = '';
        tooltip.style.display = 'none';
      });
    });
  </script>
</body>
</html>
