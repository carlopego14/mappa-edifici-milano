<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Milano — Stratificazione Cronologica del Costruito</title>
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
  <script src="https://unpkg.com/pmtiles@3.2.0/dist/pmtiles.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0f0f19; font-family: Arial, sans-serif; }
    #map { width: 100vw; height: 100vh; }

    #title {
      position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
      z-index: 1000; background: rgba(10,10,20,0.92); color: #f9fafb;
      padding: 9px 22px; border-radius: 10px; font-size: 16px;
      font-weight: bold; border: 1px solid #374151; white-space: nowrap;
      pointer-events: none;
    }

    #legend {
      position: fixed; bottom: 40px; left: 12px; z-index: 1000;
      background: rgba(10,10,20,0.93); color: #e5e7eb;
      padding: 14px 16px; border-radius: 10px; font-size: 12px;
      border: 1px solid #374151; min-width: 170px;
    }
    #legend h4 {
      margin-bottom: 10px; font-size: 13px; font-weight: 700;
      border-bottom: 1px solid #374151; padding-bottom: 6px;
    }
    .legend-item { display: flex; align-items: center; margin: 5px 0; }
    .legend-color {
      width: 16px; height: 16px; border-radius: 3px;
      margin-right: 8px; flex-shrink: 0;
    }
    #legend small { display: block; margin-top: 10px; color: #9ca3af; font-size: 10px; }

    #tooltip {
      position: fixed; pointer-events: none; z-index: 1000;
      background: rgba(10,10,20,0.93); color: #f9fafb;
      padding: 8px 12px; border-radius: 8px; font-size: 13px;
      border: 1px solid #374151; display: none;
    }
  </style>
</head>
<body>
  <div id="title">🇮🇹 Milano — Stratificazione Cronologica del Costruito</div>

  <div id="legend">
    <h4>🏛️ Epoca di costruzione</h4>
    <div class="legend-item"><div class="legend-color" style="background:#3b0764"></div><span>Prima del 1919</span></div>
    <div class="legend-item"><div class="legend-color" style="background:#1e3a8a"></div><span>1919–1945</span></div>
    <div class="legend-item"><div class="legend-color" style="background:#0e7490"></div><span>1946–1960</span></div>
    <div class="legend-item"><div class="legend-color" style="background:#166534"></div><span>1961–1970</span></div>
    <div class="legend-item"><div class="legend-color" style="background:#4d7c0f"></div><span>1971–1980</span></div>
    <div class="legend-item"><div class="legend-color" style="background:#ca8a04"></div><span>1981–1990</span></div>
    <div class="legend-item"><div class="legend-color" style="background:#c2410c"></div><span>1991–2000</span></div>
    <div class="legend-item"><div class="legend-color" style="background:#dc2626"></div><span>Dopo il 2000</span></div>
    <div class="legend-item"><div class="legend-color" style="background:#4b5563"></div><span>Sconosciuto</span></div>
    <small>Fonte: ISTAT Censimento 2011<br>Geometrie: Microsoft Building Footprints</small>
  </div>

  <div id="tooltip"></div>
  <div id="map"></div>

  <script>
    // Registra protocollo PMTiles
    const protocol = new pmtiles.Protocol();
    maplibregl.addProtocol("pmtiles", protocol.tile);

    // URL del file PMTiles — stesso repo GitHub
    const PMTILES_URL = "pmtiles://https://carlopego14.github.io/mappa-edifici-milano/mappa_milano.pmtiles";

    const map = new maplibregl.Map({
      container: 'map',
      style: {
        version: 8,
        glyphs: "https://demotiles.maplibre.org/font/{fontstack}/{range}.pbf",
        sources: {
          'carto-dark': {
            type: 'raster',
            tiles: ['https://a.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}.png'],
            tileSize: 256,
            attribution: '&copy; CARTO &copy; OSM contributors'
          },
          'edifici': {
            type: 'vector',
            url: PMTILES_URL,
          }
        },
        layers: [{
          id: 'background',
          type: 'raster',
          source: 'carto-dark'
        }]
      },
      center: [9.19, 45.46],
      zoom: 12,
      maxZoom: 19,
      minZoom: 8
    });

    map.addControl(new maplibregl.NavigationControl(), 'top-right');
    map.addControl(new maplibregl.ScaleControl(), 'bottom-right');
    map.addControl(new maplibregl.FullscreenControl(), 'top-right');

    map.on('load', () => {
      // Layer fill colorato per epoca
      map.addLayer({
        id: 'edifici-fill',
        type: 'fill',
        source: 'edifici',
        'source-layer': 'edifici',
        paint: {
          'fill-color': [
            'match', ['get', 'epoca'],
            'Prima del 1919',  '#3b0764',
            '1919–1945',       '#1e3a8a',
            '1946–1960',       '#0e7490',
            '1961–1970',       '#166534',
            '1971–1980',       '#4d7c0f',
            '1981–1990',       '#ca8a04',
            '1991–2000',       '#c2410c',
            'Dopo il 2000',    '#dc2626',
            '#4b5563'  // fallback sconosciuto
          ],
          'fill-opacity': [
            'interpolate', ['linear'], ['zoom'],
            10, 0.7,
            15, 0.88
          ]
        }
      });

      // Bordi edifici (visibili solo a zoom alto)
      map.addLayer({
        id: 'edifici-border',
        type: 'line',
        source: 'edifici',
        'source-layer': 'edifici',
        paint: {
          'line-color': '#000000',
          'line-width': [
            'interpolate', ['linear'], ['zoom'],
            12, 0.1,
            16, 0.6
          ],
          'line-opacity': [
            'interpolate', ['linear'], ['zoom'],
            11, 0,
            13, 0.5
          ]
        }
      });

      // Tooltip al passaggio del mouse
      const tooltip = document.getElementById('tooltip');

      map.on('mousemove', 'edifici-fill', (e) => {
        map.getCanvas().style.cursor = 'pointer';
        const props = e.features[0].properties;
        const epoca = props.epoca || 'Sconosciuto';
        tooltip.style.display = 'block';
        tooltip.style.left = (e.originalEvent.clientX + 14) + 'px';
        tooltip.style.top  = (e.originalEvent.clientY - 10) + 'px';
        tooltip.innerHTML = '🏛️ <b>' + epoca + '</b>';
      });

      map.on('mouseleave', 'edifici-fill', () => {
        map.getCanvas().style.cursor = '';
        tooltip.style.display = 'none';
      });
    });
  </script>
</body>
</html>
